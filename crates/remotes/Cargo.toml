[package]
name = "remotes"
description = "Dolt's remotes API: the chunk store service and table file transfers, as a server and as a client store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs = "1.18.1"
axum = "0.8"
base64 = "0.22"
doltdb = { path = "../doltdb" }
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
serial = { path = "../serial" }
sha2 = "0.10"
store = { path = "../store" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "process", "io-util", "time"] }
tokio-stream = "0.1"
tonic = "0.13"
tower = { version = "0.5", features = ["util"] }
zstd = "0.13"

[lints]
workspace = true
