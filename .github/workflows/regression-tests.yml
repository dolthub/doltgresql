name: Regression Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGRESSION_TESTING: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-main:
    name: Resolve main
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.resolve.outputs.main_sha }}

    steps:
      - name: Checkout DoltgreSQL
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve main SHA
        id: resolve
        run: echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pr-regression:
    name: PR regression
    runs-on: ubuntu-latest
    needs: resolve-main

    steps:
      - name: Checkout DoltgreSQL
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Git User
        uses: fregante/setup-git-user@v2

      - name: Merge base into PR
        run: |
          git fetch origin ${{ needs.resolve-main.outputs.main_sha }}
          git merge ${{ needs.resolve-main.outputs.main_sha }} --no-commit --no-ff

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.workflow }}-${{ matrix.os }}${{ matrix.platform }}

      - name: Install the Postgres regression suite
        run: ./scripts/install_regress_suite.sh "$RUNNER_TEMP/regress"

      - name: Test PR branch
        continue-on-error: true
        run: |
          mkdir -p out
          cargo build --release -p server 2>&1 | tee out/pr-regress.log
          cargo build --profile quick -p regress 2>&1 | tee -a out/pr-regress.log
          set +e
          timeout 90m target/quick/regress run "$RUNNER_TEMP/regress/suite" \
            "doltgres:$(pwd)/target/release/doltgres" "$RUNNER_TEMP/regress/psql" out/pr \
            2>&1 | tee -a out/pr-regress.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" = "124" ]; then
            echo "panic: test timed out" >> out/pr-regress.log
          fi
          exit "$test_status"

      - name: Fail if PR regression process deadlocked
        run: |
          if grep -q "panic: test timed out" out/pr-regress.log; then
            echo "::error::The PR regression run hung and was killed by the 90m timeout. See pr-regress.log (uploaded as an artifact)."
            exit 1
          fi

      - name: Upload PR regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/pr/results.json
            out/pr-regress.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  main-regression:
    name: Main regression
    runs-on: ubuntu-latest
    needs: resolve-main

    steps:
      - name: Checkout DoltgreSQL
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout DoltgreSQL main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-main.outputs.main_sha }}
          path: main

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: main/go.mod
          cache-dependency-path: main/go.sum

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.workflow }}-${{ matrix.os }}${{ matrix.platform }}

      - name: Install the Postgres regression suite
        run: ./scripts/install_regress_suite.sh "$RUNNER_TEMP/regress"

      - name: Test main branch
        continue-on-error: true
        run: |
          mkdir -p out
          (cd main && ./postgres/parser/build.sh && go build -o "$RUNNER_TEMP/doltgres-main" ./cmd/doltgres) 2>&1 | tee out/main-regress.log
          cargo build --profile quick -p regress 2>&1 | tee -a out/main-regress.log
          set +e
          timeout 90m target/quick/regress run "$RUNNER_TEMP/regress/suite" \
            "doltgres:$RUNNER_TEMP/doltgres-main" "$RUNNER_TEMP/regress/psql" out/main \
            2>&1 | tee -a out/main-regress.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" = "124" ]; then
            echo "panic: test timed out" >> out/main-regress.log
          fi
          exit "$test_status"

      - name: Fail if main regression process deadlocked
        run: |
          if grep -q "panic: test timed out" out/main-regress.log; then
            echo "::error::The main regression run hung and was killed by the 90m timeout. See main-regress.log (uploaded as an artifact)."
            exit 1
          fi

      - name: Upload main regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/main/results.json
            out/main-regress.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  regression-tests:
    runs-on: ubuntu-latest
    needs:
      - resolve-main
      - pr-regression
      - main-regression
    if: always() && needs.pr-regression.result != 'cancelled' && needs.main-regression.result != 'cancelled'

    steps:
      - name: Checkout DoltgreSQL
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.workflow }}-${{ matrix.os }}${{ matrix.platform }}

      - name: Download PR regression artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: regression-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/pr

      - name: Download main regression artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: regression-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/main

      - name: Check results
        id: check_results
        run: |
          if [[ -f out/main/main/results.json && -f out/pr/pr/results.json ]]; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
            echo "One of the branches could not successfully complete their tests."
            echo "Please review uploaded regression artifacts for errors, which must be fixed."
            exit 1
          fi

      - name: Build Regression Test Results Comment
        id: build_results
        if: steps.check_results.outputs.results_exist == 'true'
        run: |
          cargo build --profile quick -p regress
          # Pass via file, not $GITHUB_OUTPUT: large output through env trips ARG_MAX in github-script.
          target/quick/regress compare out/main/main/results.json out/pr/pr/results.json > "$RUNNER_TEMP/regression-comment.md"
          cp "$RUNNER_TEMP/regression-comment.md" out/regression-comment.md
          cat "$RUNNER_TEMP/regression-comment.md"
          if [ -s "$RUNNER_TEMP/regression-comment.md" ]; then
            echo "has_output=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_output=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/regression-comment.md
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Is PR From Fork
        id: from_fork
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "This is running from a fork, skipping commenting"
            echo "fork=true" >> $GITHUB_OUTPUT
          else
            echo "This is not running from a fork"
            echo "fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Comment
        if: steps.from_fork.outputs.fork == 'false' && steps.build_results.outputs.has_output == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: ${{ runner.temp }}/regression-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const commentMarker = '<!-- go-run-output -->'
            // GitHub caps comment bodies at 65536 chars.
            const MAX_BODY = 65000
            let output = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
            let body = `${commentMarker}\n${output}`
            if (body.length > MAX_BODY) {
              const notice = '\n\n_Output truncated; see workflow logs for the full report._'
              body = body.slice(0, MAX_BODY - notice.length) + notice
            }

            // List comments on the PR
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            // Check if a comment already exists
            const comment = comments.find(comment => comment.body.includes(commentMarker))

            if (comment) {
              // Update the existing comment
              await github.rest.issues.updateComment({
                comment_id: comment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              })
            } else {
              // Create a new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              })
            }
