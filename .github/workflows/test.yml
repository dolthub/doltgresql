name: Test
on: [pull_request]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Set timezone for Unix
      uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "America/Los_Angeles"
        timezoneMacos: "America/Los_Angeles"
    - name: Set timezone for Windows
      if: ${{ matrix.platform == 'windows-latest' }}
      shell: pwsh
      run: |
        tzutil /s "Pacific Standard Time"
        tzutil /g
        Get-TimeZone
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Set up Rust
      run: rustup toolchain install
    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ github.workflow }}-${{ matrix.os }}${{ matrix.platform }}
    - name: Setup PostgreSQL
      uses: tj-actions/install-postgresql@v3
      with:
        postgresql-version: 15
    - name: Build server
      shell: bash
      run: cargo build --release -p server
    - name: Test crates
      shell: bash
      run: |
        bin="$(pwd)/target/release/doltgres"
        if [ -f "$bin.exe" ]; then bin="$(cygpath -w "$bin.exe")"; fi
        DOLTGRES_BIN_PATH="$bin" cargo test --profile quick --workspace --exclude doltgres-tests --exclude driver --no-fail-fast
    - name: Test scripts
      shell: bash
      run: |
        bin="$(pwd)/target/release/doltgres"
        if [ -f "$bin.exe" ]; then bin="$(cygpath -w "$bin.exe")"; fi
        DOLTGRES_TEST_TARGET="doltgres:$bin" cargo test --profile quick -p doltgres-tests --no-fail-fast
