name: Check Compatibility

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'core/**'
      - 'server/**'
      - 'integration-tests/**'
      - 'crates/**'
      - 'third_party/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ci-compatibility-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compatibility Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ^16

      - name: Create CI Bin
        run: |
          mkdir -p ./.ci_bin
          echo "$(pwd)/.ci_bin" >> $GITHUB_PATH

      - name: Install Bats
        run: |
          npm i bats
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH
        working-directory: ./.ci_bin

      - name: Install DoltgreSQL
        run: |
          cargo build --release -p server
          cp target/release/doltgres .ci_bin/doltgres

      - name: Install PSQL
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-15

      - name: Make scripts executable
        run: chmod +x runner.sh test_files/setup_repo.sh
        working-directory: ./integration-tests/compatibility

      - name: Run compatibility tests
        run: ./runner.sh
        working-directory: ./integration-tests/compatibility
