name: Static Analysis & Linter
on: [pull_request]

concurrency:
  group: ci-staticcheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run Staticcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build SQL Syntax
        run: ./build.sh
        working-directory: ./postgres/parser
        shell: bash
      - name: Run check
        run: ./run_staticcheck.sh
        working-directory: ./scripts
  rust:
    name: Run Rust format and lint checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        run: rustup toolchain install
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check -p admin -p doltdb -p objects -p store -p prolly -p serial -p sql -p blobstores -p remotes -p driver -p harness -p pgproto -p bench -p goport -p regression -p logictest -p server
      - name: Run clippy
        run: cargo clippy --profile quick --workspace --all-targets -- -D warnings
