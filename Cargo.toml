[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
pgproto = { path = "crates/pgproto" }

# pg_query with `parse_with_cursor`, which reports the position of parse errors.
[patch.crates-io]
pg_query = { path = "third_party/pg_query" }

# Whole-program optimization, which inlines across crates on the hot paths of query execution.
[profile.release]
lto = "fat"
codegen-units = 1

# The release profile without whole-program optimization, for building quickly while measuring changes.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
